services:
  db:
    image: postgres:16-alpine
    container_name: nbs-smp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nbs_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nbs_smp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nbs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nbs} -d ${POSTGRES_DB:-nbs_smp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nbs_pgdata:
